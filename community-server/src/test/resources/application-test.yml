spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cool_community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.cool: DEBUG
    org.springframework: INFO

jwt:
  secret: test-secret-key-for-unit-testing-purpose-only
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
